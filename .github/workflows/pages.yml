name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/validate.js && node tools/lint_forms.js
      - run: node tools/bank.js --check && node tools/build_manifest.js
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node site/build.js
          mkdir -p _site
          cp -r site/dist/. _site/
          cp -r engine _site/engine
          mkdir -p _site/content && cp -r content/tests content/schema content/bank _site/content/ && rm -rf _site/content/bank/units _site/content/tests/recipes
          cp -r generator _site/generator
          mkdir -p _site/tools && cp tools/ctw_generate.js tools/validate.js tools/lint_forms.js tools/bank.js _site/tools/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
