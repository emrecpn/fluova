<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluova — Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css?v=6">
<script src="js/i18n.js?v=2"></script>
</head>
<body>
<div class="field" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="pagebar">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="var(--c2)" stroke="var(--ink)" stroke-width="2"/><path d="M8 16c3-6 9-6 12 0" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="10" r="2.2" fill="var(--ink)"/></svg>
      Fluova
    </a>
    <span class="grow"></span>
    <a class="btn btn-sm" href="index.html" data-i18n="home">All tests</a>
    <div id="lang"></div>
  </header>

  <h1 class="page-h" data-i18n="res.title">Your results</h1>
  <p class="sub" id="formTitle"></p>
  <div id="main">
    <h2 data-i18n="res.auto">Automatically scored sections</h2>
    <div class="scorebar" id="autoScores"></div>
    <p class="small" data-i18n="res.scale"></p>
    <div class="note" id="pathNote"></div>

    <h2 style="margin-top:40px" data-i18n="res.ws">Writing &amp; Speaking</h2>
    <p><span data-i18n="res.wsP"></span> <code id="fname"></code></p>
    <div class="tile mt" id="fbBox">
      <span class="pill yellow" data-i18n="res.fb.pill">Free feedback</span>
      <h3 data-i18n="res.fb.h">Get feedback on Writing and Speaking</h3>
      <p class="small" data-i18n="res.fb.p"></p>
      <div class="actions"><button class="btn btn-primary" id="fbBtn" data-i18n="res.fb.btn">Copy feedback prompt</button></div>
      <p class="small mt" id="fbMsg" aria-live="polite"></p>
      <textarea class="bundle hidden mt" id="fbText" readonly aria-label="Feedback prompt"></textarea>
    </div>
    <div class="tile mt" id="planBox">
      <span class="pill green" data-i18n="res.plan.pill">Study plan</span>
      <h3 data-i18n="res.plan.h">Turn these results into a personal study plan</h3>
      <p class="small" data-i18n="res.plan.p"></p>
      <div class="check-row">
        <label class="small"><span data-i18n="res.plan.date">Test date (optional)</span> <input type="date" id="planDate"></label>
        <label class="small"><span data-i18n="res.plan.min">Minutes per day</span> <input type="number" id="planMin" min="15" max="300" step="15" value="60" style="width:5.5em"></label>
      </div>
      <div class="actions"><button class="btn btn-primary" id="planBtn" data-i18n="res.plan.btn">Copy study-plan prompt</button></div>
      <p class="small mt" id="planMsg" aria-live="polite"></p>
      <textarea class="bundle hidden mt" id="planText" readonly aria-label="Study plan prompt"></textarea>
    </div>

    <div class="actions mt">
      <a class="btn btn-primary" id="reviewLink" data-i18n="res.review">Review question by question</a>
      <button class="btn" id="dlBtn" data-i18n="res.download">Download results again</button>
      <button class="btn" id="copyBtn" data-i18n="res.copy">Copy as text</button>
    </div>
    <textarea class="bundle hidden mt" id="bundle" readonly></textarea>
  </div>
  <p class="disclaimer" data-i18n="disclaimer"></p>
</div>

<script src="js/loader.js?v=2"></script>
<script>
(function () {
  I18N.apply(); I18N.switcher(document.getElementById('lang'));
  const p = new URLSearchParams(location.search); const id = (p.get('test') || p.get('form') || 'pilot-01').replace(/[^a-z0-9-]/gi, '');
  let raw = null; try { raw = localStorage.getItem('fluova_results_' + id); } catch (e) {}
  if (!raw) { document.getElementById('main').innerHTML = `<div class="note">${t('res.none')} <a href="index.html">${t('home')}</a></div>`; return; }
  const r = JSON.parse(raw);
  const when = new Date(r.date).toLocaleString(I18N.lang);
  document.getElementById('formTitle').textContent = r.formTitle + ' · ' + when;
  document.getElementById('reviewLink').href = 'review.html?test=' + id;

  const practice = r.level === 'practice';
  function card(name, s, overall) {
    if (practice) return `<div class="scorecard"><div class="name" lang="en">${name}</div><div class="band">${Math.round((s.pct || 0) * 100)}%</div><div class="raw">${t('res.correctOf', { c: s.correct, t: s.total })}</div></div>`;
    const path = s.path ? ' · ' + t('res.path.' + s.path) : '';
    return `<div class="scorecard ${overall ? 'overall' : ''}">
      <div class="name" lang="en">${name}</div>
      <div class="band">${s.band.toFixed(1)}</div>
      <div class="raw">${t('res.correctOf', { c: s.correct, t: s.total })} · ~${s.scaled30}/30${path}</div>
    </div>`;
  }
  const blank = name => `<div class="scorecard"><div class="name" lang="en">${name}</div><div class="band">—</div><div class="raw">${t('res.notScored')}</div></div>`;
  document.getElementById('autoScores').innerHTML =
    (r.reading && !r.reading.missing ? card('Reading', r.reading) : '') + (r.listening && !r.listening.missing ? card('Listening', r.listening) : '') +
    (practice ? '' : blank('Writing') + blank('Speaking'));

  let pn = '';
  // practice sets of Reading or Listening have nothing to say about Writing/Speaking
  const hasWS = (r.writing && (r.writing.email || r.writing.discussion || (r.writing.buildSentence || []).length)) ||
    (r.speaking && ((r.speaking.listenRepeat || []).length || (r.speaking.interview || []).length));
  if (practice && !hasWS) ['[data-i18n="res.ws"]', '[data-i18n="res.wsP"]', '[data-i18n="res.wsHow"]', '#fbBox']
    .forEach(q => { const n = document.querySelector(q); if (n) (n.closest('p') && q !== '#fbBox' && q !== '[data-i18n="res.ws"]' ? n.closest('p') : n).hidden = true; });
  if (practice) { const sc = document.querySelector('[data-i18n="res.scale"]'); if (sc) sc.hidden = true; }
  if (practice) pn = t('res.practiceNote');
  else if ((r.reading && r.reading.path === 'easy') || (r.listening && r.listening.path === 'easy')) pn = t('res.easyNote');
  else if (r.reading && r.listening && r.reading.path === 'hard' && r.listening.path === 'hard') pn = t('res.hardNote');
  document.getElementById('pathNote').textContent = pn || t('res.adaptive');

  const fname = 'fluova_' + id + '_results.json';
  document.getElementById('fname').textContent = fname;
  document.getElementById('dlBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(r, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = fname; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };

  // Plain-text copy (English labels: meant for pasting into a feedback tool or sharing)
  const w = r.writing || {}, s = r.speaking || {}, none = '(blank)';
  let b = `===== FLUOVA ${id} — RESULTS =====\nDate: ${when}\n\n--- AUTO-SCORED ---\n`;
  ['reading', 'listening'].forEach(k => { const x = r[k]; if (x && !x.missing && x.band != null) b += `${k[0].toUpperCase() + k.slice(1)}: band ${x.band.toFixed(1)} (${x.correct}/${x.total}, ${x.path || '-'})\n`; });
  b += '\n--- WRITING 1: BUILD A SENTENCE ---\n';
  (w.buildSentence || []).forEach((x, i) => { b += `${i + 1}) ${x.ok ? '[CORRECT]' : '[WRONG]'}  Mine: ${x.given || none}${x.ok ? '' : '  | Correct: ' + x.correct}\n`; });
  b += '\n--- WRITING 2: EMAIL ---\n' + (w.email ? w.email.trim() : none) + '\n';
  b += '\n--- WRITING 3: ACADEMIC DISCUSSION ---\n' + (w.discussion ? w.discussion.trim() : none) + '\n';
  b += '\n--- SPEAKING: LISTEN AND REPEAT ---\n';
  (s.listenRepeat || []).forEach((x, i) => { b += `${i + 1}) accuracy ${x.accuracy != null ? x.accuracy + '%' : '-'}\n   Target: ${x.target}\n   Heard: ${x.transcript || none}\n`; });
  b += '\n--- SPEAKING: INTERVIEW (transcripts) ---\n';
  (s.interview || []).forEach((x, i) => { b += `${i + 1}) Q: ${x.question}\n   A: ${x.transcript || none}\n`; });

  // ---- Feedback prompt: the learner pastes it into any chatbot (no account or API on our side) ----
  const LANGNAME = { en: 'English', tr: 'Turkish', es: 'Spanish' };
  function feedbackPrompt(test) {
    const ws = test ? (test.sections.find(x => x.id === 'writing') || { screens: [] }).screens : [];
    const em = ws.find(x => x.kind === 'email'), di = ws.find(x => x.kind === 'discussion');
    const strip = h => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    let p = `You are an experienced English writing and speaking coach. Below are my answers from a full-length practice test in the format of the TOEFL iBT® test (2026 version). Give me honest, specific feedback. Write your feedback in ${LANGNAME[I18N.lang] || 'English'}, but quote my English exactly when you correct it.

For each task: give a score from 0 to 5, explain it in two or three sentences, then list my three most important fixes, each with my original sentence and an improved version. Finish with an estimated Writing band and Speaking band on the 1–6 scale and the one habit that would raise my score most.

What a strong answer looks like (summary, not official wording):
- Email (0–5): covers every requested point; clear organization; tone that suits the reader; varied and accurate grammar and vocabulary.
- Academic discussion (0–5): a clear opinion, supported with reasons or examples; adds a new idea instead of repeating the other students; relevant to the professor's question; at least about 100 words; varied and accurate language.
- Listen and Repeat (0–5 per sentence): how completely and accurately the sentence was repeated.
- Interview (0–5 per answer): answers the question directly, develops it with reasons or examples, and uses clear, varied language.
Important: my spoken answers were transcribed automatically by the browser, so a few words may be recognition errors. Do not penalize an obvious transcription error; you cannot judge pronunciation from text.
`;
    p += `\n=== WRITING 1: EMAIL ===\n`;
    if (em) p += `Situation: ${strip(em.scenario)}\nTask: ${strip(em.prompt)}\n`;
    p += `My email:\n${(w.email || '').trim() || '(no answer)'}\n`;
    p += `\n=== WRITING 2: ACADEMIC DISCUSSION ===\n`;
    if (di) p += `Task: ${strip(di.prompt)}\nProfessor ${di.professor.name}: ${strip(di.professor.post)}\n${di.students.map(x => `${x.name}: ${strip(x.post)}`).join('\n')}\n`;
    p += `My post:\n${(w.discussion || '').trim() || '(no answer)'}\n`;
    if ((s.listenRepeat || []).length) {
      p += `\n=== SPEAKING 1: LISTEN AND REPEAT ===\n`;
      s.listenRepeat.forEach((x, i) => { p += `${i + 1}. Target: ${x.target}\n   What I said (transcript): ${x.transcript || '(nothing recognized)'}\n`; });
    }
    if ((s.interview || []).length) {
      p += `\n=== SPEAKING 2: INTERVIEW (45 seconds per answer) ===\n`;
      s.interview.forEach((x, i) => { p += `${i + 1}. Question: ${x.question}\n   My answer (transcript): ${x.transcript || '(nothing recognized)'}\n`; });
    }
    return p;
  }
  const fbBtn = document.getElementById('fbBtn'), fbMsg = document.getElementById('fbMsg'), fbText = document.getElementById('fbText');
  fbBtn.onclick = () => {
    FluovaContent.load(id).catch(() => null).then(test => {
      fbText.value = feedbackPrompt(test); fbText.classList.remove('hidden');
      const ok = () => { fbMsg.textContent = t('res.fb.copied'); };
      navigator.clipboard.writeText(fbText.value).then(ok, () => { fbText.select(); try { document.execCommand('copy'); } catch (e) {} ok(); });
    });
  };

  // ---- Study plan prompt: diagnosis by task and question type + targeted drills + day-by-day plan ----
  function studyPlanPrompt(test, answers) {
    const strip = h => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    // question type from the start of the explanation ("Inference: …", "Main idea (paraphrase) …")
    const qtype = (q, task) => {
      const w = String((q && q.why && (typeof q.why === 'string' ? q.why : q.why.en)) || '').slice(0, 40);
      if (task === 'Listen and Choose a Response') return 'choosing a response';
      if (/vocabulary/i.test(w)) return 'vocabulary in context';
      if (/^main|main (idea|point|purpose|change|concern)/i.test(w)) return 'main idea / main purpose';
      if (/inference|infer|implied|attitude/i.test(w)) return 'inference';
      if (/purpose|function|figurative/i.test(w)) return "purpose / function";
      if (/detail|paraphrase|reason|problem|suggestion|change|application/i.test(w)) return 'detail';
      return 'other';
    };
    const taskOf = (scr, secId) => scr.type === 'ctw' ? 'Complete the Words' : scr.type === 'choose_response' ? 'Listen and Choose a Response'
      : scr.type === 'passage' ? (/daily life/i.test(scr.directions || '') ? 'Read in Daily Life' : 'Read an Academic Passage')
      : /^Conversation/i.test(scr.title || '') ? 'Conversation' : /^Announcement/i.test(scr.title || '') ? 'Announcement' : secId === 'listening' ? 'Academic Talk' : scr.type;
    const index = {};
    if (test) for (const sec of test.sections) {
      const pools = [sec.screens].concat(sec.adaptive ? [sec.adaptive.hard, sec.adaptive.easy] : []);
      for (const pool of pools) for (const scr of pool) {
        const task = taskOf(scr, sec.id);
        if (scr.type === 'ctw') scr.items.forEach(it => { index[it.id] = { task, type: 'word completion', ctw: it }; });
        else if (scr.type === 'choose_response') index[scr.id] = { task, type: qtype(scr, task), q: { stem: '(spoken prompt) ' + scr.audio.map(a => a.text).join(' '), options: scr.options, answer: scr.answer, why: scr.why } };
        else (scr.questions || []).forEach(q => { index[q.id] = { task, type: qtype(q, task), q }; });
      }
    }
    const stats = {}, missed = [];
    ['reading', 'listening'].forEach(secId => ((r.details || {})[secId] || []).forEach(d => {
      const info = index[d.id] || { task: d.group, type: 'other' };
      const k = `${secId[0].toUpperCase() + secId.slice(1)} · ${info.task}`;
      stats[k] = stats[k] || { ok: 0, n: 0, types: {} }; stats[k].n++; if (d.correct) stats[k].ok++;
      const tk = info.type; stats[k].types[tk] = stats[k].types[tk] || { ok: 0, n: 0 }; stats[k].types[tk].n++; if (d.correct) stats[k].types[tk].ok++;
      if (!d.correct && missed.length < 30) {
        const a = answers ? answers[d.id] : undefined;
        if (info.ctw) missed.push(`- [${info.task}] wrote "${info.ctw.stub}${a || '___'}", correct "${info.ctw.stub}${info.ctw.answer}"`);
        else if (info.q) missed.push(`- [${info.task} · ${info.type}] ${strip(info.q.stem)}\n  My answer: ${a != null && info.q.options[a] != null ? strip(info.q.options[a]) : '(blank)'}\n  Correct: ${strip(info.q.options[info.q.answer])}\n  Why: ${strip(typeof info.q.why === 'string' ? info.q.why : (info.q.why || {}).en || '')}`);
      }
    }));
    const date = document.getElementById('planDate').value, mins = document.getElementById('planMin').value || 60;
    let p = `You are an experienced English exam coach. Below are my detailed results from a full-length practice test in the format of the TOEFL iBT® test (2026 version). Write your answer in ${({ en: 'English', tr: 'Turkish', es: 'Spanish' })[I18N.lang] || 'English'}, but keep all practice material in English.

Please do four things:
1. Diagnosis: my strongest and weakest tasks and question types, and the pattern behind my mistakes (use the explanations of the questions I missed).
2. My recurring language errors in Writing and Speaking (at most five patterns), each with an example from my answers and the corrected version.
3. For each of my three weakest areas, a short targeted drill in the same format as the real test (for example a Complete the Words paragraph, inference questions on a short passage, Build a Sentence items, or interview questions to answer aloud). Put the answers and explanations at the end.
4. A day-by-day plan ${date ? `until my test on ${date}` : 'for the next two weeks'}, about ${mins} minutes per day. Mix your drills, review of my mistakes, and full practice tests (I can take more at Fluova; each "New test" uses questions I have not seen).

=== SCORES ===
${['reading', 'listening'].filter(k => r[k] && !r[k].missing && r[k].band != null).map(k => `${k[0].toUpperCase() + k.slice(1)}: band ${r[k].band.toFixed(1)} (${r[k].correct}/${r[k].total}${r[k].path ? ', ' + (r[k].path === 'hard' ? 'upper' : 'lower') + ' second module' : ''})`).join('\n')}

=== ACCURACY BY TASK AND QUESTION TYPE ===
${Object.entries(stats).map(([k, v]) => `${k}: ${v.ok}/${v.n}` + Object.entries(v.types).filter(([t]) => t !== 'word completion').map(([t, x]) => `\n   ${t}: ${x.ok}/${x.n}`).join('')).join('\n')}

=== QUESTIONS I MISSED ===
${missed.join('\n') || '(none)'}

=== BUILD A SENTENCE ===
${(w.buildSentence || []).map((x, i) => `${i + 1}. ${x.ok ? 'correct' : 'wrong'} · mine: ${x.given} · correct: ${x.correct}`).join('\n') || '(no answers)'}

=== MY EMAIL ===
${(w.email || '').trim() || '(no answer)'}

=== MY DISCUSSION POST ===
${(w.discussion || '').trim() || '(no answer)'}

=== MY SPEAKING (automatic transcripts, may contain recognition errors) ===
${(s.listenRepeat || []).map((x, i) => `Repeat ${i + 1}: target "${x.target}" · I said "${x.transcript || ''}"`).join('\n')}
${(s.interview || []).map((x, i) => `Interview ${i + 1}: ${x.question}\n   I said: ${x.transcript || '(nothing recognized)'}`).join('\n')}
`;
    return p;
  }
  const planBtn = document.getElementById('planBtn'), planMsg = document.getElementById('planMsg'), planText = document.getElementById('planText');
  planBtn.onclick = () => {
    let answers = r.answers || null; if (!answers) try { answers = (JSON.parse(localStorage.getItem('fluova_progress_' + id) || '{}')).answers || null; } catch (e) {}
    FluovaContent.load(id).catch(() => null).then(test => {
      planText.value = studyPlanPrompt(test, answers); planText.classList.remove('hidden');
      const ok = () => { planMsg.textContent = t('res.fb.copied'); };
      navigator.clipboard.writeText(planText.value).then(ok, () => { planText.select(); try { document.execCommand('copy'); } catch (e) {} ok(); });
    });
  };

  const ta = document.getElementById('bundle'); ta.value = b;
  const copyBtn = document.getElementById('copyBtn');
  copyBtn.onclick = () => {
    ta.classList.remove('hidden'); ta.select();
    const okMsg = () => { copyBtn.textContent = '✓ ' + t('res.copied'); };
    navigator.clipboard.writeText(ta.value).then(okMsg, () => { try { document.execCommand('copy'); } catch (e) {} okMsg(); });
  };
})();
</script>
</body>
</html>
