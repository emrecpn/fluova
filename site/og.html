<!DOCTYPE html>
<!-- Source for og.png (1200×630 share image). Regenerate:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --screenshot=site/og.png site/og.html -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#f6f4fd;color:#2a2342;font-family:Figtree,sans-serif;position:relative}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6}
  .card{position:absolute;inset:48px;background:#fff;border:3px solid #2a2342;border-radius:34px;box-shadow:10px 10px 0 #2a2342;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px;font:800 34px Unbounded,sans-serif}
  h1{font:800 70px/1.05 Unbounded,sans-serif;letter-spacing:-.02em;margin:0}
  h1 em{font-style:normal;display:inline-block;background:#b6ecd5;border:3px solid #2a2342;border-radius:22px;padding:0 .2em;transform:rotate(-2deg);box-shadow:6px 6px 0 #2a2342;margin-top:10px}
  .foot{display:flex;gap:14px;align-items:center;font:500 22px 'DM Mono',monospace}
  .chip{border:3px solid #2a2342;border-radius:999px;padding:6px 18px;background:#ffe59e}
  .chip.b{background:#cbbcff}.chip.c{background:#ffc6b4}
</style></head>
<body>
  <div class="blob" style="width:520px;height:520px;background:#cbbcff;left:-120px;top:-160px"></div>
  <div class="blob" style="width:460px;height:460px;background:#b6ecd5;right:-120px;bottom:-160px"></div>
  <div class="card">
    <div class="brand"><svg width="44" height="44" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12.5" fill="#b6ecd5" stroke="#2a2342" stroke-width="2"/><path d="M8 16c3-6 9-6 12 0" fill="none" stroke="#2a2342" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="10" r="2.2" fill="#2a2342"/></svg>Fluova</div>
    <h1>Practice like the real test.<br><em>Free for everyone.</em></h1>
    <div class="foot"><span class="chip">2026 format</span><span class="chip b">adaptive</span><span class="chip c">open source</span></div>
  </div>
</body></html>
